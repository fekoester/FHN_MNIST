[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fhn-mnist"
version = "0.2.0"
description = "FitzHugh–Nagumo neuron networks on MNIST: backprop through time vs three-factor plasticity"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Felix Köster"}]
dependencies = ["torch>=2.1", "torchvision>=0.16", "numpy", "matplotlib>=3.7"]

[project.optional-dependencies]
video = ["imageio", "imageio-ffmpeg"]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["fhn_mnist*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
